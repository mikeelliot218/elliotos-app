name: Build ElliotOS APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk git curl wget unzip python3 2>/dev/null || true

      - name: Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/ct.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/ct.zip -d /tmp/ct
          sudo mv /tmp/ct/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R $(whoami) /opt/android-sdk
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platforms;android-35" "build-tools;35.0.1" "ndk;26.3.11579264" 2>/dev/null
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses 2>/dev/null || true

      - name: Clone termux-generator
        run: git clone --depth=1 https://github.com/robertkirkman/termux-generator.git /opt/termux-generator

      - name: Inject ElliotOS
        run: |
          mkdir -p /opt/termux-generator/plugins/elliotos
          printf '%s\n' \
            '#!/bin/bash' \
            '# Injetar no .bashrc do home do bootstrap' \
            'BASHRC="$BOOTSTRAP_DIR/home/.bashrc"' \
            'printf '"'"'%s\n'"'"' \' \
            '  '"'"'# ElliotOS autoinstall'"'"' \' \
            '  '"'"'if [ ! -f "$HOME/.elliotos_installed" ]; then'"'"' \' \
            '  '"'"'  echo "========================================"'"'"' \' \
            '  '"'"'  echo "  ElliotOS — Instalando..."'"'"' \' \
            '  '"'"'  echo "========================================"'"'"' \' \
            '  '"'"'  curl -fsSL https://raw.githubusercontent.com/mikeelliot218/ElliotOS/main/luascript.sh -o "$HOME/luascript.sh" && bash "$HOME/luascript.sh" && touch "$HOME/.elliotos_installed"'"'"' \' \
            '  '"'"'fi'"'"' \' \
            '  >> "$BASHRC"' \
            > /opt/termux-generator/plugins/elliotos/plugin.sh
          chmod +x /opt/termux-generator/plugins/elliotos/plugin.sh
          cat /opt/termux-generator/plugins/elliotos/plugin.sh

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_HOME=/opt/android-sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          cd /opt/termux-generator
          chmod +x build-termux.sh
          ./build-termux.sh \
            --name com.elliotos.terminal \
            --type play-store \
            --architectures aarch64 \
            --add lua54 \
            --plugin elliotos \
            2>&1 | tee /tmp/build.log

      - name: Collect APKs
        run: |
          mkdir -p /tmp/apks
          find /opt/termux-generator -name "*.apk" -exec cp {} /tmp/apks/ \;
          ls -lh /tmp/apks/ || echo "Nenhum APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ElliotOS-APKs
          path: /tmp/apks/
          retention-days: 30

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
